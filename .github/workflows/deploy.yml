name: Deploy to Pages

on:
  push:
    branches: [main]
  # Lets the site be redeployed by hand from the Actions tab without a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued push supersedes the one before it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No `npm install`: this project is deliberately zero-dependency, and the
      # lockfile it does have only pins an empty tree.

      # Fails the deploy on any WCAG AA regression in either theme.
      - name: Audit colour contrast
        run: npm run check

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
